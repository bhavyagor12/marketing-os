[project]
name = "marketing-os-agents"
version = "0.0.1"
description = "Agent orchestration service for Marketing OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2.60",
  "langchain-anthropic>=0.3",
  "langchain-core>=0.3",
  "anthropic>=0.40",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "langgraph-checkpoint-postgres>=2.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PL", "RUF"]

[tool.mypy]
strict = true
